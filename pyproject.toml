[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-python-starter"
version = "0.1.0"
description = "Starting point for Python AWS Lambda services: shared code, typed events, JSON logging, tests, local invoke and a SAM template."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
# boto3 is already present in the Lambda Python runtime; it is listed here for local runs and tests.
dependencies = ["boto3>=1.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "moto[dynamodb]>=5", "pyyaml>=6"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["shared", "handlers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
